    <!-- MAIN WORKSPACE AREA -->
    <main class="main-body">
      <div class="dashboard-content">

        <!-- PAGE TITLE HEADER -->
        <section class="page-title-section">
          <div class="title-text">
            <span class="category-label">SCHEDULE MANAGEMENT</span>
            <h1 class="page-heading">Create Class Schedule</h1>
          </div>
        </section>

        <!-- FORM CARD CONTAINER -->
        <div class="form-card">
          <div class="form-card-header">
            <div>
              <h2>Class Schedule Details</h2>
              <p>Add a BSIT teaching schedule to organize classes and student assignments.</p>
            </div>
          </div>

          <div id="scheduleErrorMessage" class="error-banner" style="display: none;"></div>

          <form id="createScheduleForm" onsubmit="saveSchedule(event)">
            
            <!-- Row 1: Subject. The program is fixed to BSIT. -->
            <div class="form-row">
              <div class="form-group form-group-wide">
                <label for="subjectCode">Subject Code / Title</label>
                <input type="text" id="subjectCode" placeholder="e.g. ITC 111 - Computer Programming" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group form-group-wide">
                <label for="teacherName">Professor</label>
                <select id="teacherName" required disabled>
                  <option value="">Loading professors...</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="roomNumber">Room / Lab</label>
                <input type="text" id="roomNumber" placeholder="e.g. Lab 302" required>
              </div>

              <div class="form-group">
                <label for="classDay">Day</label>
                <select id="classDay" required>
                  <option value="" disabled selected>Select Day</option>
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                  <option value="Sunday">Sunday</option>
                </select>
              </div>
            </div>

            <!-- Row 4: Start Time & End Time -->
            <div class="form-row">
              <div class="form-group">
                <label for="startTime">Start Time</label>
                <div class="time-input-group">
                  <input type="text" id="startTime" inputmode="numeric" pattern="([1-9]|1[0-2]):[0-5][0-9]" maxlength="5" placeholder="e.g. 8:00" required>
                  <select id="startPeriod" aria-label="Start time AM or PM">
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="endTime">End Time</label>
                <div class="time-input-group">
                  <input type="text" id="endTime" inputmode="numeric" pattern="([1-9]|1[0-2]):[0-5][0-9]" maxlength="5" placeholder="e.g. 11:00" required>
                  <select id="endPeriod" aria-label="End time AM or PM">
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
              <button type="reset" class="btn-clear">Clear</button>
              <button type="submit" class="btn-submit">Save Schedule</button>
            </div>

          </form>
        </div>

      </div>
