<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Professor Portal - Students</title>
        <link rel="stylesheet" href="teacher_portal.css?v=202610120217">
    </head>
    <body>
        <header class="navbar">
            <a class="nav-brand" href="tdashboard.html?v=202610102334">
                <img src="/Profile%20pic_part/Arellano_University_New_Logo.png?v=202609280110" alt="Arellano University logo">
                <span>Arellano University | Professor Portal</span>
            </a>
            <a class="profile-link" href="/Profile pic_part/Profile section.html?v=202610102334">Profile</a>
            <button id="logoutBtn" class="logout-button" type="button">Logout</button>
        </header>
        <main class="dashboard-container">
            <div class="page-header">
                <div>
                    <p class="eyebrow">PROFESSOR PORTAL</p>
                    <h1>View Students</h1>
                    <p class="dashboard-subtitle">Select a department and course, then a professor and subject to view its students.</p>
                </div>
                <a class="back-link" href="tdashboard.html?v=202610102334">Back to dashboard</a>
            </div>
            <section class="content-card">
                <div id="subjectList" class="subject-list">
                    <p class="notice">Loading subjects...</p>
                </div>
            </section>
            <section id="assignedStudentsPanel" class="content-card assigned-students" hidden>
                <div class="assigned-students-header">
                    <h2 id="selectedSubjectTitle">Students</h2>
                    <button type="button" id="teacherExportClassList" class="teacher-export-button" disabled>Export Class List</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Student No.</th><th>Name</th><th>Course</th><th>Year</th><th>Schedule</th><th>Status</th></tr></thead>
                        <tbody id="assignedStudentsBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    <script src="/auth-client.js?v=202610012123"></script>
        <script src="/socket.io/socket.io.min.js"></script>
        <script src="teacher_shared.js?v=202609280105"></script>
        <script src="/vendor/xlsx.full.min.js"></script>
        <script src="/View students fol/classListExport.js?v=202609241951"></script>
        <script src="teacher_students.js?v=202609261832"></script>
    </body>
</html>
